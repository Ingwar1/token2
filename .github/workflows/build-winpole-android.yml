name: Build WinPole Android APK

on:
  push:
    branches: [winpole-android-build]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.4 game patches
        run: |
          git apply tools/v03-mainactivity.patch
          git apply tools/v04-a.patch
          git apply tools/v04-b.patch
          sed -i "s/versionCode 2/versionCode 4/; s/versionName '0.2-original-assets'/versionName '0.4-full-game-flow'/" app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image extractor
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download original Windows game
        run: |
          curl --fail --location --retry 3 --insecure \
            --user-agent 'Mozilla/5.0' \
            'https://16-bits.ru/winpole/winpole-beta2.zip' \
            --output /tmp/winpole-beta2.zip
          unzip -t /tmp/winpole-beta2.zip

      - name: Extract original visual assets
        run: python tools/extract_assets.py /tmp/winpole-beta2.zip .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pole-chudes-android-apk-v04
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
